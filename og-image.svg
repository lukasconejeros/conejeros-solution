<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0f0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="100" rx="400" ry="300" fill="rgba(59,130,246,0.08)"/>
  <ellipse cx="200" cy="530" rx="300" ry="200" fill="rgba(139,92,246,0.06)"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Badge top left -->
  <rect x="60" y="60" width="200" height="32" rx="16" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="160" y="81" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="2">IA PARA CLÍNICAS</text>

  <!-- Main logo / name -->
  <text x="60" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="96" font-weight="900" fill="url(#accent)" letter-spacing="-2">Orion.AI</text>

  <!-- Tagline -->
  <text x="60" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="400" fill="rgba(255,255,255,0.75)">Deja de perder pacientes por no contestar a tiempo</text>

  <!-- Description -->
  <text x="60" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.45)">Chatbot con IA · Agendamiento automático · Integración con Dentalink y Dentalsoft</text>

  <!-- Divider line -->
  <line x1="60" y1="380" x2="480" y2="380" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Stat pills -->
  <rect x="60" y="410" width="180" height="52" rx="12" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <text x="150" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">RESPUESTA</text>
  <text x="150" y="452" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#22d3ee" text-anchor="middle">En segundos · 24/7</text>

  <rect x="260" y="410" width="180" height="52" rx="12" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="350" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">CANALES</text>
  <text x="350" y="452" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">WhatsApp · IG · FB</text>

  <rect x="460" y="410" width="220" height="52" rx="12" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="570" y="430" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">INTEGRACIÓN</text>
  <text x="570" y="452" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="middle">Dentalink · Dentalsoft</text>

  <!-- CTA Right side -->
  <rect x="800" y="240" width="340" height="180" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="970" y="290" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">DESDE</text>
  <text x="970" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="900" fill="#FFD580" text-anchor="middle">$160.000</text>
  <text x="970" y="375" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">CLP / mes</text>
  <text x="970" y="405" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="rgba(255,213,128,0.7)" text-anchor="middle">Primer mes GRATIS</text>

  <!-- Domain -->
  <text x="970" y="555" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="rgba(255,255,255,0.3)" text-anchor="middle">conejeros-solutions.cl</text>

  <!-- Bottom clients bar -->
  <rect x="60" y="510" width="680" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="60" y="545" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">Clínicas que confían en Orion:</text>
  <text x="60" y="568" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.55)">Clínica Mónaco (Valdivia) · Dental Anpalex (Santiago)</text>
</svg>
